<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — Le Petit Perchoir</title>
  <script>
    // Ancienne adresse technique : on renvoie vers le vrai domaine, même chemin.
    if (/\.workers\.dev$/.test(location.hostname)) {
      location.replace('https://lepetitperchoir.fr' + location.pathname + location.search + location.hash);
    }
  </script>
  <style>
    body { font: 18px system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; background: #f6f5f1; color: #1d2421; }
    a { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.4rem; border-radius: 14px; background: #1f7a63; color: #fff; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #121614; color: #eef1ef; } a { background: #3fb597; color: #08241c; } }
  </style>
</head>
<body>
  <main>
    <div style="font-size: 3rem">🪺</div>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou n'est plus disponible.</p>
    <a href="/">Retour au portail</a>
  </main>
</body>
</html>
